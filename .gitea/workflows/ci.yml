name: CI Lint & Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python & lightweight test dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends python3 python3-pip python3-venv
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install ruff pytest polars pyyaml pillow requests

      - name: Lint with Ruff
        run: |
          .venv/bin/ruff check mintcastiq_ingest/normalization mintcastiq_ingest/persistence mintcastiq_ingest/vlm tests/test_normalization.py

      - name: Run unit tests
        run: |
          .venv/bin/pytest -v --ignore=tests/test_ocr.py
